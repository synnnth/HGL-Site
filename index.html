<style>
  :root {
    --bg: #0c2217;
    --bg-2: #123222;
    --panel: #163a29;
    --panel-2: #1b4630;
    --line: #2b5a41;
    --olive: #8a9f6b;
    --olive-bright: #b4c98f;
    --text: #e8eedc;
    --muted: #9db3a0;
    --win: #9ccc65;
    --loss: #e57373;
    --tie: #f2b84b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% -200px, #1a4a33 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 16px 48px; }

  header { text-align: center; margin-bottom: 22px; }
  header img { height: 150px; width: auto; filter: drop-shadow(0 4px 18px rgba(0,0,0,.5)); }
  header h1 { margin: 10px 0 2px; font-size: 13px; letter-spacing: .35em; text-transform: uppercase; color: var(--olive); font-weight: 600; }
  header .sub { color: var(--muted); font-size: 13px; }

  .tabs { display: flex; justify-content: center; gap: 6px; margin-bottom: 18px; }
  .tab {
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    padding: 10px 22px; border-radius: 999px; font: inherit; font-weight: 600; letter-spacing: .04em;
    cursor: pointer; transition: all .15s;
  }
  .tab:hover { color: var(--text); border-color: var(--olive); }
  .tab.active { background: var(--olive); color: #0c2217; border-color: var(--olive); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 560px; }
  th, td { padding: 12px 14px; text-align: center; }
  th { font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--olive-bright); background: var(--bg-2); border-bottom: 1px solid var(--line); font-weight: 800; padding-top: 15px; padding-bottom: 15px; }
  td { border-bottom: 1px solid rgba(43,90,65,.55); font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--panel-2); }
  .left { text-align: left; }
  .right { text-align: right; }
  table.match { table-layout: fixed; min-width: 640px; }
  table.match th, table.match td { padding-left: 20px; padding-right: 20px; }

  .rank { width: 56px; font-weight: 800; font-size: 18px; color: var(--olive-bright); }
  tr.r1 .rank { color: #f5d76e; }
  tr.r1 { background: linear-gradient(90deg, rgba(245,215,110,.10), transparent 55%); }

  .team { display: flex; align-items: center; gap: 12px; }
  .badge {
    width: 38px; height: 38px; flex: none; border-radius: 10px; display: grid; place-items: center;
    background: var(--bg-2); border: 1px solid var(--line); color: var(--olive-bright);
    font-weight: 800; font-size: 13px; letter-spacing: .03em; overflow: hidden;
  }
  .badge img { width: 100%; height: 100%; object-fit: contain; }
  .tname { font-weight: 700; font-size: 16px; }
  .members { color: var(--muted); font-size: 12px; margin-top: 2px; }

  .rec { font-weight: 700; }
  .pos { color: var(--win); font-weight: 700; }
  .neg { color: var(--loss); font-weight: 700; }
  .zero { color: var(--muted); font-weight: 700; }
  .dim { color: var(--muted); }

  .mv { margin-left: 10px; font-size: 14px; font-weight: 800; cursor: help; }
  .mv.up { color: var(--win); }
  .mv.down { color: var(--loss); }
  .mv.same { color: var(--muted); }
  .tie {
    display: inline-flex; align-items: center; gap: 4px; margin-left: 10px; padding: 2px 8px;
    border-radius: 999px; border: 1px solid var(--tie); color: var(--tie);
    font-size: 11px; font-weight: 800; letter-spacing: .08em; cursor: help; vertical-align: middle;
  }
  .h2h {
    display: inline-block; margin-left: 10px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--olive); color: var(--olive-bright); font-size: 11px; font-weight: 700; letter-spacing: .08em; cursor: help; vertical-align: middle;
  }
  .legend { padding: 12px 18px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); background: var(--bg-2); line-height: 1.7; }

  /* filters */
  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px; border-bottom: 1px solid var(--line); background: var(--bg-2); }
  .filters .count { margin-left: auto; color: var(--muted); font-size: 13px; }
  .ms { position: relative; }
  .ms > button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 14px; font: inherit; cursor: pointer; display: flex; gap: 8px; align-items: center; min-width: 150px; justify-content: space-between;
  }
  .ms > button:hover, .ms.open > button { border-color: var(--olive); }
  .ms > button .lbl { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .ms .panel {
    display: none; position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; min-width: 240px; max-height: 320px; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--olive); border-radius: 10px; padding: 6px; box-shadow: 0 12px 28px rgba(0,0,0,.5);
  }
  .ms.open .panel { display: block; }
  .ms label { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .ms label:hover { background: var(--panel-2); }
  .ms input { accent-color: var(--olive); width: 16px; height: 16px; }
  .ms .clear { width: 100%; background: none; border: 0; color: var(--olive-bright); padding: 8px 10px; text-align: left; font: inherit; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--line); margin-bottom: 4px; }

  .match td.score { font-weight: 800; font-size: 17px; }
  .match .winner { font-weight: 800; color: var(--text); }
  .match .loser { color: var(--muted); }
  .wk { color: var(--olive-bright); font-weight: 700; text-align: left; }
  .empty { padding: 36px; text-align: center; color: var(--muted); }


  /* team links + team screen */
  a.tlink { color: inherit; text-decoration: none; cursor: pointer; border-bottom: 1px dashed transparent; transition: color .12s, border-color .12s; }
  a.tlink:hover, a.tlink:focus-visible { color: var(--olive-bright); border-bottom-color: var(--olive); outline: none; }
  .backbar { padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--bg-2); }
  .back { color: var(--olive-bright); text-decoration: none; font-weight: 600; font-size: 14px; }
  .back:hover { text-decoration: underline; }
  .thead { display: flex; align-items: center; gap: 18px; padding: 24px 22px 20px; background: linear-gradient(90deg, rgba(138,159,107,.14), transparent 70%); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .thead .badge { width: 72px; height: 72px; border-radius: 16px; }
  .thead h2 { margin: 0; font-size: 28px; letter-spacing: .01em; }
  .thead .stats { display: flex; gap: 22px; margin-top: 8px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
  .thead .stats b { display: block; color: var(--text); font-size: 18px; font-variant-numeric: tabular-nums; letter-spacing: 0; }
  .thead .stats .lbl { text-transform: uppercase; letter-spacing: .1em; font-size: 11px; }
  .sec { border-bottom: 1px solid var(--line); }
  .sec:last-child { border-bottom: 0; }
  .sec-h { margin: 0; padding: 16px 22px 10px; font-size: 14px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--olive-bright); display: flex; align-items: baseline; gap: 10px; }
  .sec-h .n { color: var(--muted); font-weight: 600; letter-spacing: .04em; font-size: 12px; text-transform: none; }
  .roster { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; padding: 4px 22px 22px; }
  .player { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-weight: 700; }
  .player.cap { border-color: var(--olive); background: linear-gradient(90deg, rgba(138,159,107,.18), var(--bg-2)); }
  .plink { flex: 1; }
  .cap-tag { font-size: 10px; font-weight: 800; letter-spacing: .1em; color: #0c2217; background: var(--olive); border-radius: 999px; padding: 2px 8px; }
  .tsec table { min-width: 460px; }
  .tsec th { font-size: 12px; padding-top: 11px; padding-bottom: 11px; }
  .next { display: inline-block; margin-left: 10px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--olive); color: var(--olive-bright); font-size: 10px; font-weight: 800; letter-spacing: .1em; vertical-align: middle; }
  .res { display: inline-block; min-width: 26px; padding: 2px 8px; border-radius: 6px; font-weight: 800; font-size: 12px; letter-spacing: .06em; }
  .res.w { background: rgba(156,204,101,.16); color: var(--win); }
  .res.l { background: rgba(229,115,115,.16); color: var(--loss); }
  .res.d { background: rgba(157,179,160,.16); color: var(--muted); }
  .mini { color: var(--muted); font-size: 12px; margin-left: 8px; font-weight: 400; }
  .sec .empty { padding: 20px 22px 26px; }

  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
  [hidden] { display: none !important; }
  @media (max-width: 600px) { header img { height: 110px; } th, td { padding: 10px 8px; } }
</style>
</head>

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDiff = d => `<span class="${d > 0 ? 'pos' : d < 0 ? 'neg' : 'zero'}">${d > 0 ? '+' : ''}${d}</span>`;

/* ---------- navigation (hash router: #standings, #results, #team/<name>) ---------- */
let lastTab = 'standings';
function route() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  const isTeam = h.startsWith('team/') && DATA.standings.some(s => s.team === h.slice(5));
  const view = isTeam ? 'team' : h === 'results' ? 'results' : 'standings';
  if (view !== 'team') lastTab = view;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.tab === view));
  ['standings', 'results', 'team'].forEach(id => document.getElementById(id).hidden = id !== view);
  if (isTeam) { renderTeam(h.slice(5)); window.scrollTo(0, 0); }
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { location.hash = '#' + b.dataset.tab; }));
window.addEventListener('hashchange', route);
const teamLink = name => `<a class="tlink" href="#team/${encodeURIComponent(name)}" title="View ${esc(name)}">${esc(name)}</a>`;

/* ---------- standings ---------- */
function teamCell(name) {
  const meta = DATA.teams[name] || {};
  const badge = meta.logo ? `<div class="badge"><img src="${meta.logo}" alt=""></div>` : '';
  const members = meta.members && meta.members.length ? `<div class="members">${meta.members.map(esc).join(' · ')}</div>` : '';
  return `<div class="team">${badge}<div><div class="tname">${teamLink(name)}</div>${members}</div></div>`;
}
function renderStandings() {
  const rows = DATA.standings.map(s => {
    const mv = s.move == null ? '' : s.move > 0
      ? `<span class="mv up" title="Up ${s.move} since last week (was #${s.prev_rank})">&#9650;</span>` : s.move < 0
      ? `<span class="mv down" title="Down ${-s.move} since last week (was #${s.prev_rank})">&#9660;</span>`
      : `<span class="mv same" title="No change since last week">&ndash;</span>`;
    const tie = s.tied_with.length
      ? `<span class="tie" title="Tied with ${esc(s.tied_with.join(', '))} on series record and differential with no head-to-head advantage (they haven't met, or split their meetings), so order is provisional.">&#9888; TIED</span>` : '';
    const h2h = s.h2h_break
      ? `<span class="h2h" title="Ranked above/below a team level on record and differential based on head-to-head result.">H2H</span>` : '';
    return `<tr class="${s.rank === 1 ? 'r1' : ''}">
      <td class="rank">${s.rank}</td>
      <td class="left"><div style="display:flex;align-items:center;flex-wrap:wrap">${teamCell(s.team)}${mv}${tie}${h2h}</div></td>
      <td class="rec">${s.w}-${s.l}${s.d ? '-' + s.d : ''}</td>
      <td class="dim">${s.mf}-${s.ma}</td>
      <td>${fmtDiff(s.diff)}</td>
    </tr>`;
  }).join('');
  const anyTie = DATA.standings.some(s => s.tied_with.length);
  document.getElementById('standings').innerHTML = `
    <div class="scroll"><table>
      <thead><tr><th>Rank</th><th class="left">Team</th><th>Series</th><th>Map Count</th><th>Diff</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="legend">
      Ranked by series record, then cumulative score differential, then head-to-head result.
      ${DATA.standings.some(s => s.move != null) ? '<span class="mv up" style="margin-left:0">&#9650;</span> <span class="mv down" style="margin-left:0">&#9660;</span> <span class="mv same" style="margin-left:0">&ndash;</span> Rank movement vs. standings before the latest week.<br>' : ''}
      ${anyTie ? '<br><span class="tie" style="margin-left:0">&#9888; TIED</span> Level on record and differential with no head-to-head advantage (not played yet, or split) &mdash; order is provisional.' : ''}
      ${DATA.standings.some(s => s.h2h_break) ? '<br><span class="h2h" style="margin-left:0">H2H</span> Separated from a team level on record and differential by head-to-head result.' : ''}
    </div>`;
}

/* ---------- multi-select ---------- */
function multiSelect(root, label, options, allText, onChange) {
  const selected = new Set();
  root.innerHTML = `<button type="button"><span><span class="lbl">${label}</span> <span class="val">${allText}</span></span><span>&#9662;</span></button>
    <div class="panel"><button type="button" class="clear">Clear selection</button>
    ${options.map(o => `<label><input type="checkbox" value="${esc(o.value)}"> ${esc(o.text)}</label>`).join('')}</div>`;
  const btn = root.querySelector('button'), val = root.querySelector('.val');
  const refresh = () => {
    val.textContent = selected.size === 0 ? allText : selected.size === 1 ? options.find(o => String(o.value) === [...selected][0]).text : `${selected.size} selected`;
    onChange(selected);
  };
  btn.addEventListener('click', e => { e.stopPropagation(); document.querySelectorAll('.ms.open').forEach(x => x !== root && x.classList.remove('open')); root.classList.toggle('open'); });
  root.querySelector('.panel').addEventListener('click', e => e.stopPropagation());
  root.querySelectorAll('input').forEach(i => i.addEventListener('change', () => { i.checked ? selected.add(i.value) : selected.delete(i.value); refresh(); }));
  root.querySelector('.clear').addEventListener('click', () => { selected.clear(); root.querySelectorAll('input').forEach(i => i.checked = false); refresh(); });
}
document.addEventListener('click', () => document.querySelectorAll('.ms.open').forEach(x => x.classList.remove('open')));

/* ---------- match results ---------- */
let selTeams = new Set(), selWeeks = new Set();
function renderResults() {
  const rows = DATA.matches.filter(m =>
    (!selTeams.size || selTeams.has(m.t1) || selTeams.has(m.t2)) &&
    (!selWeeks.size || selWeeks.has(String(m.week))));
  document.getElementById('res-body').innerHTML = rows.map(m => {
    const c1 = m.s1 > m.s2 ? 'winner' : m.s1 < m.s2 ? 'loser' : '';
    const c2 = m.s2 > m.s1 ? 'winner' : m.s2 < m.s1 ? 'loser' : '';
    return `<tr><td class="wk">Week ${m.week}</td>
      <td class="right ${c1}">${teamLink(m.t1)}</td>
      <td class="score"><span class="${c1}">${m.s1}</span> <span class="dim">-</span> <span class="${c2}">${m.s2}</span></td>
      <td class="left ${c2}">${teamLink(m.t2)}</td></tr>`;
  }).join('');
  document.getElementById('res-empty').hidden = rows.length > 0;
  document.getElementById('res-count').textContent = `${rows.length} of ${DATA.matches.length} matches`;
}
const teamNames = DATA.standings.map(s => s.team).sort((a, b) => a.localeCompare(b));
const weeks = [...new Set(DATA.matches.map(m => m.week))].sort((a, b) => a - b);
multiSelect(document.getElementById('f-team'), 'Team', teamNames.map(t => ({ value: t, text: t })), 'All teams', s => { selTeams = s; renderResults(); });
multiSelect(document.getElementById('f-week'), 'Week', weeks.map(w => ({ value: w, text: 'Week ' + w })), 'All weeks', s => { selWeeks = s; renderResults(); });

/* ---------- team screen ---------- */
function renderTeam(name) {
  const st = DATA.standings.find(s => s.team === name);
  const meta = DATA.teams[name] || {};
  const info = (DATA.roster || {})[name] || { players: [], captain: '' };
  const byTeam = Object.fromEntries(DATA.standings.map(s => [s.team, s]));
  const key = (w, a, b) => w + '|' + [a, b].sort().join('|');

  // played: from results CSV, seen from this team's side
  const played = DATA.matches.filter(m => m.t1 === name || m.t2 === name).map(m => {
    const home = m.t1 === name;
    return { week: m.week, opp: home ? m.t2 : m.t1, us: home ? m.s1 : m.s2, them: home ? m.s2 : m.s1 };
  }).sort((a, b) => a.week - b.week);
  const playedKeys = new Set(DATA.matches.map(m => key(m.week, m.t1, m.t2)));

  // upcoming: scheduled series with no result yet
  const upcoming = DATA.schedule.filter(x => (x.t1 === name || x.t2 === name) && !playedKeys.has(key(x.week, x.t1, x.t2)))
    .map(x => ({ week: x.week, series: x.series, opp: x.t1 === name ? x.t2 : x.t1 }))
    .sort((a, b) => a.week - b.week || a.series - b.series);

  const logo = meta.logo ? `<div class="badge"><img src="${meta.logo}" alt=""></div>` : '';
  const players = info.players.length
    ? info.players.map(p => `<div class="player ${p === info.captain ? 'cap' : ''}"><a class="tlink plink" href="https://haloquery.com/players/${encodeURIComponent(p)}" target="_blank" rel="noopener noreferrer" title="Open ${esc(p)} on HaloQuery">${esc(p)}</a>${p === info.captain ? '<span class="cap-tag">CAPTAIN</span>' : ''}</div>`).join('')
    : '';
  const oppCell = o => {
    const os = byTeam[o];
    return `${teamLink(o)}${os ? `<span class="mini">#${os.rank} &middot; ${os.w}-${os.l}</span>` : ''}`;
  };

  const upRows = upcoming.map((u, i) => `<tr>
      <td class="wk">Week ${u.week}</td><td class="dim left">Series ${u.series}</td>
      <td class="left" style="font-weight:700">${oppCell(u.opp)}${i === 0 ? '<span class="next">NEXT</span>' : ''}</td></tr>`).join('');
  const plRows = played.map(p => {
    const r = p.us > p.them ? ['w', 'W'] : p.us < p.them ? ['l', 'L'] : ['d', 'D'];
    return `<tr><td class="wk">Week ${p.week}</td>
      <td class="left" style="font-weight:700">${oppCell(p.opp)}</td>
      <td class="score" style="font-weight:800;font-size:17px">${p.us} <span class="dim">-</span> ${p.them}</td>
      <td><span class="res ${r[0]}">${r[1]}</span></td></tr>`;
  }).join('');

  document.getElementById('team').innerHTML = `
    <div class="backbar"><a class="back" href="#${lastTab}">&larr; Back to ${lastTab === 'results' ? 'Match Results' : 'Standings'}</a></div>
    <div class="thead">
      ${logo}
      <div>
        <h2>${esc(name)}</h2>
        <div class="stats">
          <div><span class="lbl">Rank</span><b>#${st.rank}</b></div>
          <div><span class="lbl">Series</span><b>${st.w}-${st.l}${st.d ? '-' + st.d : ''}</b></div>
          <div><span class="lbl">Map Count</span><b>${st.mf}-${st.ma}</b></div>
          <div><span class="lbl">Diff</span><b>${fmtDiff(st.diff)}</b></div>
        </div>
      </div>
    </div>
    <div class="sec"><h3 class="sec-h">Roster</h3>
      ${players ? `<div class="roster">${players}</div>` : '<div class="empty">No roster on file.</div>'}
    </div>
    <div class="sec tsec"><h3 class="sec-h">Upcoming Matches <span class="n">${upcoming.length} remaining</span></h3>
      ${upcoming.length ? `<div class="scroll"><table>
        <thead><tr><th class="left">Week</th><th class="left">Series</th><th class="left">Opponent</th></tr></thead>
        <tbody>${upRows}</tbody></table></div>` : '<div class="empty">No upcoming matches &mdash; the regular season is complete.</div>'}
    </div>
    <div class="sec tsec"><h3 class="sec-h">Matches Played <span class="n">${played.length} played</span></h3>
      ${played.length ? `<div class="scroll"><table>
        <thead><tr><th class="left">Week</th><th class="left">Opponent</th><th>Score</th><th>Result</th></tr></thead>
        <tbody>${plRows}</tbody></table></div>` : '<div class="empty">No matches played yet.</div>'}
    </div>`;
}

/* ---------- init ---------- */
document.getElementById('gen').textContent = `Updated ${DATA.generated}`;
renderStandings();
renderResults();
route();
</script>
